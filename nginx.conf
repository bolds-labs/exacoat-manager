# -----------------------------------------------------------------------------
# 1. Wildcard Artist Subdomains: {artist}.mttr.art -> artmatter.co/artist/{artist}
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<artist_sub>(?!www\b)[a-zA-Z0-9_-]+)\.mttr\.art$;

    # Health check for Dokploy / Traefik
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Root -> Artist Storefront on Artmatter with referral attribution
    location = / {
        if ($args != '') {
            return 302 https://artmatter.co/artist/$artist_sub?$args&r=$artist_sub;
        }
        return 302 https://artmatter.co/artist/$artist_sub?r=$artist_sub;
    }

    # Product page under artist subdomain: mateo.mttr.art/mona-lisa-10883
    location ~* ^/(?:posters/)?([^/]+)/?$ {
        set $artwork_slug $1;
        if ($args != '') {
            return 302 https://artmatter.co/posters/$artwork_slug?$args&r=$artist_sub;
        }
        return 302 https://artmatter.co/posters/$artwork_slug?r=$artist_sub;
    }
}

# -----------------------------------------------------------------------------
# 2. Main Shortlink Domain: mttr.art and www.mttr.art
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mttr.art www.mttr.art;

    # Health check for Dokploy / Traefik
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Root redirect -> artmatter.co
    location = / {
        return 302 https://artmatter.co/$is_args$args;
    }

    # Posters / product direct prefix
    location ~* ^/(?:posters|product|artwork)/([^/]+)/?$ {
        return 302 https://artmatter.co/posters/$1$is_args$args;
    }

    # Collection direct prefix
    location ~* ^/collection/([^/]+)/?$ {
        return 302 https://artmatter.co/collection/$1$is_args$args;
    }

    # Two segment path: /{artist_name}/{artwork_slug} -> https://artmatter.co/posters/{artwork_slug}?r={artist_name}
    location ~* ^/([^/]+)/([^/]+)/?$ {
        set $artist_slug $1;
        set $artwork_slug $2;
        
        if ($args != '') {
            return 302 https://artmatter.co/posters/$artwork_slug?$args&r=$artist_slug;
        }
        return 302 https://artmatter.co/posters/$artwork_slug?r=$artist_slug;
    }

    # Single segment path: /{artist_name} -> https://artmatter.co/artist/{artist_name}?r={artist_name}
    location ~* ^/([^/]+)/?$ {
        set $artist_slug $1;

        if ($args != '') {
            return 302 https://artmatter.co/artist/$artist_slug?$args&r=$artist_slug;
        }
        return 302 https://artmatter.co/artist/$artist_slug?r=$artist_slug;
    }
}

# -----------------------------------------------------------------------------
# Main Application Server (Manager & Artist Portals)
# -----------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml font/woff2;
    gzip_disable "MSIE [1-6]\.";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check for Dokploy / Traefik / Uptime monitors
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Same-origin bridge restricted to the Artmatter REST namespace.
    location ^~ /cms/wp-json/artmatter-core/v1/ {
        client_max_body_size 256m;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_ssl_server_name on;
        proxy_ssl_name cms.artmatter.co;
        proxy_set_header Host cms.artmatter.co;
        proxy_set_header X-Artmatter-Original-Origin $http_origin;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass https://cms.artmatter.co/wp-json/artmatter-core/v1/;
    }

    location ^~ /cms/ {
        return 404;
    }

    location = /env-config.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # Zero-caching for SPA entrypoint, version manifest, and plugin zips
    location ~* ^/(index\.html|version\.json|artmatter-core.*\.zip)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # Static assets caching with immutable fingerprint hashes
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
