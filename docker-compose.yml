services:
  exacoat-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exacoat-manager
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
